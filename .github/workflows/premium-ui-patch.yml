name: Apply Premium UI Patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-ui:
    if: !contains(github.event.head_commit.message, '[ui-patch]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch existing index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          marker = '<style id="goanime-premium-ui-patch">'
          if marker in html:
              print('Premium UI patch already present; nothing to do.')
              raise SystemExit(0)

          patch = r'''<style id="goanime-premium-ui-patch">
/* ─── Premium liquid navigation + responsive UI overrides ─── */
:root {
  --nav-glass: rgba(16,16,18,.68);
  --nav-glass-strong: rgba(10,10,12,.86);
  --nav-highlight: rgba(255,255,255,.09);
  --nav-border: rgba(255,255,255,.12);
}

#nav {
  top: max(10px, env(safe-area-inset-top));
  left: 50%;
  right: auto;
  width: min(1180px, calc(100% - 24px));
  height: 58px;
  padding: 0 10px 0 18px;
  gap: 10px;
  transform: translateX(-50%);
  border: 1px solid var(--nav-border);
  border-radius: 999px;
  background: var(--nav-glass);
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  box-shadow: 0 14px 44px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.08);
  overflow: hidden;
  transition: background .25s ease, box-shadow .25s ease, border-color .25s ease, transform .25s ease;
}

#nav::before {
  content: '';
  position: absolute;
  inset: 1px;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(115deg, rgba(255,255,255,.11), transparent 34%, rgba(255,255,255,.035) 68%, transparent);
}

#nav > * { position: relative; z-index: 1; }

#nav.nav-scrolled {
  background: var(--nav-glass-strong);
  border-color: rgba(255,255,255,.15);
  box-shadow: 0 16px 48px rgba(0,0,0,.58), inset 0 1px 0 rgba(255,255,255,.07);
}

.nav-logo {
  padding: 8px 6px;
  border-radius: 999px;
}

.nav-logo:focus-visible,
.nav-link:focus-visible,
.nav-search-btn:focus-visible,
.nav-random-btn:focus-visible {
  outline: 2px solid rgba(255,255,255,.78);
  outline-offset: 2px;
}

.nav-links {
  gap: 3px;
  min-width: 0;
}

.nav-link {
  min-height: 40px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 8px 13px;
  border-radius: 999px;
  transition: color .18s ease, background .18s ease, transform .18s ease;
}

.nav-link:hover { transform: translateY(-1px); }
.nav-link:active { transform: scale(.96); }
.nav-link.active { background: rgba(255,255,255,.10); }

.nav-search-btn,
.nav-random-btn {
  width: 40px;
  height: 40px;
  min-width: 40px;
  border-radius: 50%;
  transition: color .18s ease, background .18s ease, transform .18s ease;
}

.nav-search-btn:hover,
.nav-random-btn:hover { transform: translateY(-1px); background: rgba(255,255,255,.09); }
.nav-search-btn:active,
.nav-random-btn:active { transform: scale(.93); }

#homePage { padding-top: 78px; }

button,
.nav-link,
.search-card,
.card { -webkit-tap-highlight-color: transparent; }

@media (max-width: 760px) {
  #nav {
    width: calc(100% - 16px);
    height: 54px;
    padding: 0 7px 0 12px;
    gap: 7px;
  }
  .nav-links { gap: 1px; }
  .nav-link { min-height: 38px; padding: 7px 10px; font-size: 12px; }
  .nav-search-btn, .nav-random-btn { width: 38px; height: 38px; min-width: 38px; }
  #homePage { padding-top: 70px; }
}

@media (max-width: 560px) {
  #nav { top: max(8px, env(safe-area-inset-top)); }
  .nav-logo { font-size: 19px; letter-spacing: 3px; padding-inline: 4px; }
  .nav-links { margin-left: auto; }
  .nav-link { padding-inline: 8px; }
  #homePage { padding-top: 68px; }
}

@media (max-width: 420px) {
  #nav { width: calc(100% - 12px); padding-left: 9px; padding-right: 5px; }
  .nav-link { font-size: 11px; padding-inline: 7px; }
  .nav-search-btn, .nav-random-btn { width: 36px; height: 36px; min-width: 36px; }
}

@media (hover: none) {
  .nav-link:hover,
  .nav-search-btn:hover,
  .nav-random-btn:hover { transform: none; }
}

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto !important; }
  #nav, #nav *, .nav-link, .nav-search-btn, .nav-random-btn {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}
</style>'''

          html = html.replace('</head>', patch + '\n</head>', 1)
          path.write_text(html, encoding='utf-8')
          print('Applied targeted premium UI overrides without rewriting index.html.')

      - name: Commit patched index.html
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "Improve responsive liquid navbar and UI [ui-patch]"
          git push

# Targeted patch: preserve the existing 4K+ line application.
